security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            # Assurez-vous que les outils de développement et les ressources statiques sont toujours autorisés.
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                # Où rediriger après la déconnexion
                target: app_home

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                # Par défaut, cette fonctionnalité est activée en cochant une case dans le
                # formulaire de connexion. Décommentez la ligne suivante pour l'activer systématiquement.
                always_remember_me: true

            # Activer différentes méthodes d'authentification :
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Seule la *première* règle de correspondance est appliquée
    access_control:
        - { path: ^/commande, roles: [ROLE_USER, ROLE_EMPLOYE, ROLE_ADMIN] }
        - { path: ^/employe, roles: ROLE_EMPLOYE }
        - { path: ^/admin, roles: ROLE_ADMIN }

    # Héritage des accès du rôle Employe par le rôle unique Admin
    role_hierarchy:
        ROLE_ADMIN: ROLE_EMPLOYE

when@test:
    security:
        password_hashers:
            # Les algorithmes de hachage de mots de passe sont conçus pour consommer beaucoup de ressources afin de garantir la sécurité.
            # Lors des tests, il est possible de réduire leur coût pour améliorer les performances.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Valeur minimale possible pour bcrypt
                time_cost: 3 # Valeur minimale possible pour argon
                memory_cost: 10 # Valeur minimale possible pour argon
