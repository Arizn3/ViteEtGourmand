services:
    nginx:
        image: nginx:1.26-alpine
        restart: unless-stopped
        depends_on:
            - php
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./app/public:/var/www/html/public:ro
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
    php:
        build:
            context: .
            dockerfile: Dockerfile.prod
        restart: unless-stopped
        depends_on:
            - mysql
            - mongodb
        env_file:
            - .env.docker
        environment:
            APP_ENV: prod
            APP_DEBUG: 0
            MONGODB_URI: mongodb://symfony:change_me_mongo@mongodb:27017/?authSource=admin
            MONGODB_DB: vitegourmand
    mysql:
        image: mysql:8.0
        restart: always
        env_file:
            - .env.docker
        volumes:
            - mysql_data:/var/lib/mysql
            - ./database/vitegourmandDBTest.sql:/docker-entrypoint-initdb.d/init.sql
    mongodb:
        image: mongo:7.0
        restart: unless-stopped
        env_file:
            - .env.docker
        volumes:
            - mongo_data:/data/db
    certbot:
        image: certbot/certbot
        container_name: vitegourmand-certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot

volumes:
    mysql_data:
    mongo_data: