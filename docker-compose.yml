# Définition des services
services:
    # Service nginx serveur HTTP (alpine)
    nginx:
        image: nginx:1.26-alpine
        # Ngnix s'arrêtera lors d'un arrêt manuel avec 'docker stop ngnix'.
        restart: unless-stopped
        depends_on:
            - php
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html
            # Fichier de configuration pour le serveur Nginx.
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    # service PHP-FPM
    php:
        # Construis l'image PHP (alpine) avec un dockerfile ce qui permet une meilleure personnalisation et l'ajout d'extension facilement.
        build: .
        # PHP s'arrêtera lors d'un arrêt manuel avec 'docker stop php'.
        restart: unless-stopped
        # Permet d'éviter le démarrage aléatoire des images, ici MySQL et MongoDB seront démarrer avant PHP mais cela ne garantit pas que
        # les services (Mysql et MongoDB) soit totalement prêt.
        depends_on:
            - mysql
            - mongodb
        volumes: 
            - ./:/var/www/html
        environment:
            MONGODB_URI: mongodb://symfony:secret@mongodb:27017/?authSource=admin
            MONGODB_DB: vitegourmand
    # Service Mysql
    mysql:
        image: mysql:8.0
        ports:
            - "3307:3306"
        # Mysql reste en always car c'est la base de données principale, en cas d'arrêt manuel avec 'docker stop mysql' il redémarrera.
        restart: always
        # on dit explicitement à Docker quel fichier .env utilisé pour les base de données cela
        # peut éviter toute confusion entre d'autres fichiers .env avec Symfony ou encore Docker,
        # mais aussi d'évité les commits d'information secrète concernant la base de données,
        # env_file va lire automatiquement les variables à l'intérieur.
        env_file:
            - .env.docker
        volumes:
            - mysql_data:/var/lib/mysql
            # Base de données créée automatiquement lors du build du conteneur MySQL
            # vitegourmandDBTest pour un démarrage avec des données de test déjà intégrées dans l'application
            # ou vitegourmandDBClear pour un démarrage avec une base vide prête à l'emploi
            - ./database/vitegourmandDBTest.sql:/docker-entrypoint-initdb.d/init.sql
            # - ./database/vitegourmandDBClear.sql:/docker-entrypoint-initdb.d/init.sql
    # Service MongoDB
    mongodb:
        image: mongo:7.0
        # MongoDB s'arrêtera lors d'un arrêt manuel avec 'docker stop mongodb'.
        restart: unless-stopped
        env_file:
            - .env.docker
        volumes:
            - mongo_data:/data/db

# Déclare les volumes pour la persistance des données des images Mysql et MongoDB
volumes:
    mysql_data:
    mongo_data: